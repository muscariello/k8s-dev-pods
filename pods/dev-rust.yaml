apiVersion: v1
kind: Pod
metadata:
  name: dev-rust
  namespace: lumuscar-jobs
  labels:
    app: dev-rust
    type: development
spec:
  restartPolicy: Always
  containers:
  - name: rust-dev
    image: rust:1.90-bookworm
    command:
      - /bin/bash
      - -c
      - |
        # Configure HTTP proxy
        export HTTP_PROXY=$HTTP_PROXY
        export HTTPS_PROXY=$HTTPS_PROXY
        export NO_PROXY=$NO_PROXY

        # Configure proxy for apt
        echo "Acquire::http::Proxy \"$HTTP_PROXY\";" > /etc/apt/apt.conf.d/proxy.conf
        echo "Acquire::https::Proxy \"$HTTPS_PROXY\";" >> /etc/apt/apt.conf.d/proxy.conf

        # Update package lists
        apt-get update

        # Install development tools and dependencies (skip packages not in bookworm)
        apt-get install -y \
          curl \
          wget \
          git \
          vim \
          nano \
          tmux \
          zsh \
          bc \
          build-essential \
          pkg-config \
          libssl-dev \
          cmake \
          protobuf-compiler \
          clang-19 \
          lldb-19 \
          lld-19 \
          clangd-19 \
          llvm \
          gcc-x86-64-linux-gnu \
          g++-x86-64-linux-gnu \
          libicu-dev \
          libxml2-dev \
          libffi-dev \
          ca-certificates || true

        # Set default Rust toolchain (rust:1.90 image comes with rustup)
        rustup default stable

        # Install rustup components
        rustup component add clippy rustfmt rust-analyzer
        rustup target add x86_64-unknown-linux-gnu
        rustup target add aarch64-unknown-linux-gnu

        # Install cargo tools (skip if fails to avoid blocking)
        cargo install cargo-watch cargo-edit cargo-outdated cargo-audit || echo "Warning: Some cargo tools failed to install"

        # Install Task (build automation)
        curl -fsSL https://taskfile.dev/install.sh -o /tmp/install-task.sh
        sh /tmp/install-task.sh -b /usr/local/bin
        rm -f /tmp/install-task.sh

        # Setup workspace
        mkdir -p /workspace
        cd /workspace

        echo "Rust development environment ready!"
        echo "Installed Rust version: $(rustc --version)"
        echo "Workspace: /workspace"

        # Keep container running
        sleep infinity
    env:
    - name: HTTP_PROXY
      value: "$HTTP_PROXY"
    - name: HTTPS_PROXY
      value: "$HTTPS_PROXY"
    - name: NO_PROXY
      value: "$NO_PROXY"
    - name: CARGO_HOME
      value: "/workspace/.cargo"
    - name: RUSTUP_HOME
      value: "/workspace/.rustup"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    resources:
      requests:
        memory: "32Gi"
        cpu: "16000m"
      limits:
        memory: "128Gi"
        cpu: "64000m"
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: dev-rust-workspace
